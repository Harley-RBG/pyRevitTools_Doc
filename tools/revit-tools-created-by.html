<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Revit Tools | Created By</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="topbar">
      <span class="topbar-title">SJ-B+C pyRevit Catalog</span>
      <span class="topbar-badge">Revit Tools</span>
      <span class="topbar-sub">Created by index from __author__ tags</span>
      <span class="topbar-tag">v1</span>
    </div>

    <div class="page">
      <div class="part">
        <span class="part-num">Authors</span>
        <span class="part-title">Created By</span>
        <span class="part-rule"></span>
      </div>

      <section class="card">
        <div class="card-head">
          <span class="card-title">Revit Tool Authors</span>
          <span class="card-hint">Filter and sort by author and tool title</span>
        </div>
        <div class="card-body">
          <a class="back-link" href="../index.html">← Back to catalog</a>
          <div class="controls" style="margin-top:10px;">
            <label class="search-wrap">
              <span>Search author or tool</span>
              <input id="author-search" type="search" placeholder="Type author, tool, panel..." />
            </label>
            <label class="search-wrap">
              <span>Sort</span>
              <select id="author-sort" class="sim-field">
                <option value="author">Author (A-Z)</option>
                <option value="tool">Tool (A-Z)</option>
                <option value="panel">Panel (A-Z)</option>
              </select>
            </label>
          </div>
          <div class="sim-table-wrap" style="margin-top:10px;">
            <table>
              <thead>
                <tr>
                  <th>Author</th>
                  <th>Tool</th>
                  <th>Panel</th>
                  <th>Stack</th>
                </tr>
              </thead>
              <tbody id="author-table-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <footer class="site-footer">
        <p>Generated: 2026-08-12T23:38:58.632Z</p>
        <p>Source: bundle.md (__author__ / __authors__ in script files)</p>
      </footer>
    </div>

    <script>
      const DATA = [{"author":"Unknown","title":"Add Coordinates","panel":"RBG Tools Data","stack":"DataStack1","pagePath":"tools/sj-pyrevit-rbg-tools-data-addcoordinates.html"},{"author":"Unknown","title":"MagpieGroup Data","panel":"RBG Tools Data","stack":"DataStack1","pagePath":"tools/sj-pyrevit-rbg-tools-data-magpiegroup.html"},{"author":"Unknown","title":"PackageCreator Dockable Panel","panel":"RBG Tools Data","stack":"DataStack3","pagePath":"tools/sj-pyrevit-rbg-tools-data-packagecreator.html"},{"author":"Unknown","title":"ParamCopier","panel":"RBG Tools Data","stack":"DataStack2","pagePath":"tools/sj-pyrevit-rbg-tools-data-paramcopier.html"},{"author":"Unknown","title":"Schedule Updater","panel":"RBG Tools Data","stack":"DataStack1","pagePath":"tools/sj-pyrevit-rbg-tools-data-scheduleupdater.html"},{"author":"Unknown","title":"Tool Dashboard","panel":"RBG Tools Data","stack":"DataStack3","pagePath":"tools/sj-pyrevit-rbg-tools-data-dashboard.html"},{"author":"Unknown","title":"Transaction Logger","panel":"RBG Tools Data","stack":"DataStack2","pagePath":"tools/sj-pyrevit-rbg-tools-data-transaction-logger.html"},{"author":"Unknown","title":"Disallow Detach Elements","panel":"RBG Tools Elements","stack":"ElementStack1","pagePath":"tools/sj-pyrevit-rbg-tools-elements-disallowdetach.html"},{"author":"Unknown","title":"Elements by Level","panel":"RBG Tools Elements","stack":"ElementStack2","pagePath":"tools/sj-pyrevit-rbg-tools-elements-selectbylevel.html"},{"author":"Unknown","title":"Quick Pin Categories","panel":"RBG Tools Elements","stack":"ElementStack1","pagePath":"tools/sj-pyrevit-rbg-tools-elements-quickpin.html"},{"author":"Unknown","title":"RevClouds to Detail Groups","panel":"RBG Tools Elements","stack":"ElementStack2","pagePath":"tools/sj-pyrevit-rbg-tools-elements-revclouddetailline.html"},{"author":"Unknown","title":"Slab Splitter","panel":"RBG Tools Elements","stack":"ElementStack1","pagePath":"tools/sj-pyrevit-rbg-tools-elements-slabsplitter.html"},{"author":"Unknown","title":"Crop Views Quick Off","panel":"RBG Tools Views","stack":"ViewStack1","pagePath":"tools/sj-pyrevit-rbg-tools-views-cropview.html"},{"author":"Unknown","title":"Grids\n2D / 3D","panel":"RBG Tools Views","stack":"ShiftClick1","pagePath":"tools/sj-pyrevit-rbg-tools-views-gridextents.html"},{"author":"Unknown","title":"Levels\n2D / 3D","panel":"RBG Tools Views","stack":"ShiftClick1","pagePath":"tools/sj-pyrevit-rbg-tools-views-levelsextents.html"},{"author":"Unknown","title":"Levels: Head Switch\nLeft / Right","panel":"RBG Tools Views","stack":"ShiftClick1","pagePath":"tools/sj-pyrevit-rbg-tools-views-levelheadswitcher.html"},{"author":"Unknown","title":"LinkedViews","panel":"RBG Tools Views","stack":"ViewStack1","pagePath":"tools/sj-pyrevit-rbg-tools-views-linkedviews.html"},{"author":"Unknown","title":"Plan View Range Tool","panel":"RBG Tools Views","stack":"ViewStack1","pagePath":"tools/sj-pyrevit-rbg-tools-views-planviewrange.html"},{"author":"Unknown","title":"Scope Box View Creation","panel":"RBG Tools Views","stack":"ViewStack2","pagePath":"tools/sj-pyrevit-rbg-tools-views-scopeboxviewcreation.html"},{"author":"Unknown","title":"Section Move","panel":"RBG Tools Views","stack":"ViewStack2","pagePath":"tools/sj-pyrevit-rbg-tools-views-sectionupdater.html"},{"author":"Unknown","title":"SheetNo","panel":"RBG Tools Views","stack":"ViewStack2","pagePath":"tools/sj-pyrevit-rbg-tools-views-sheetno.html"},{"author":"Unknown","title":"CategoryPicker","panel":"Selection","stack":"Direct","pagePath":"tools/sj-pyrevit-selection-categorypicker.html"},{"author":"Unknown","title":"Copy State","panel":"Selection","stack":"memo","pagePath":"tools/sj-pyrevit-selection-copy-state.html"},{"author":"Unknown","title":"MClear","panel":"Selection","stack":"Memory","pagePath":"tools/sj-pyrevit-selection-mclear.html"},{"author":"Unknown","title":"MDeduct","panel":"Selection","stack":"Memory","pagePath":"tools/sj-pyrevit-selection-mdeduct.html"},{"author":"Unknown","title":"Next","panel":"Selection","stack":"Memory","pagePath":"tools/sj-pyrevit-selection-next.html"},{"author":"Unknown","title":"Paste State","panel":"Selection","stack":"memo","pagePath":"tools/sj-pyrevit-selection-paste-state.html"},{"author":"Unknown","title":"Prev","panel":"Selection","stack":"Memory","pagePath":"tools/sj-pyrevit-selection-prev.html"},{"author":"Jason Braga","title":"Propagate Extents Override","panel":"Selection","stack":"Direct","pagePath":"tools/sj-pyrevit-selection-propagate-extents-override.html"},{"author":"Unknown","title":"Purge Memory Files","panel":"Selection","stack":"Memory","pagePath":"tools/sj-pyrevit-selection-purge-memory-files.html"},{"author":"Unknown","title":"Save Memory as Selection","panel":"Selection","stack":"Memory","pagePath":"tools/sj-pyrevit-selection-save-memory-as-selection.html"},{"author":"Unknown","title":"UnhideAllElements","panel":"Selection","stack":"Unhide","pagePath":"tools/sj-pyrevit-selection-unhideallelements.html"},{"author":"Unknown","title":"Cloud Revisions","panel":"Sheets","stack":"Sheet Tools","pagePath":"tools/sj-pyrevit-sheets-cloudrevisions.html"},{"author":"Unknown","title":"Reorder Selected Viewport","panel":"Sheets","stack":"Sheet Tools","pagePath":"tools/sj-pyrevit-sheets-reorder-selected-viewport.html"},{"author":"Unknown","title":"Reorder Viewports","panel":"Sheets","stack":"Sheet Tools","pagePath":"tools/sj-pyrevit-sheets-reorder-viewports.html"},{"author":"Unknown","title":"Tool1","panel":"SYD Prod WIP","stack":"Josh","pagePath":"tools/sj-pyrevit-syd-prod-wip-tool1.html"},{"author":"Unknown","title":"Tool2","panel":"SYD Prod WIP","stack":"Josh","pagePath":"tools/sj-pyrevit-syd-prod-wip-tool2.html"}];
      const searchInput = document.getElementById('author-search');
      const sortInput = document.getElementById('author-sort');
      const tableBody = document.getElementById('author-table-body');

      function includesText(value, query) {
        return String(value || '').toLowerCase().includes(query.toLowerCase());
      }

      function render() {
        const query = searchInput.value || '';
        const sortBy = sortInput.value || 'author';
        const filtered = DATA.filter((row) => {
          if (!query.trim()) {
            return true;
          }
          return includesText(row.author, query) || includesText(row.title, query) || includesText(row.panel, query) || includesText(row.stack, query);
        });

        filtered.sort((a, b) => {
          const av = String(a[sortBy] || '').toLowerCase();
          const bv = String(b[sortBy] || '').toLowerCase();
          if (av === bv) {
            return a.title.localeCompare(b.title);
          }
          return av.localeCompare(bv);
        });

        tableBody.innerHTML = filtered
          .map((row) => '<tr><td>' + row.author + '</td><td><a href="../' + row.pagePath + '">' + row.title + '</a></td><td>' + row.panel + '</td><td>' + row.stack + '</td></tr>')
          .join('');
      }

      searchInput.addEventListener('input', render);
      sortInput.addEventListener('change', render);
      render();
    </script>
  </body>
</html>
